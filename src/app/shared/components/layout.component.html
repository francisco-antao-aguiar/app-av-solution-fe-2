<div class="min-h-screen bg-secondary-50">
  <!-- Navigation Bar -->
  <nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <!-- Logo and Brand -->
        <div class="flex items-center">
          <div class="flex-shrink-0 flex items-center">
            <div class="h-10 w-10 bg-primary-600 rounded-lg flex items-center justify-center">
              <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <span class="ml-3 text-xl font-bold text-secondary-900 hidden sm:block">Hours Tracker</span>
          </div>

          <!-- Desktop Navigation -->
          <div class="hidden md:ml-10 md:flex md:space-x-1">
            <a
              routerLink="/weekly-hours"
              routerLinkActive="bg-primary-100 text-primary-700"
              class="px-4 py-2 rounded-lg text-sm font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
            >
              Vista Semanal
            </a>
            <a
              routerLink="/monthly-buy"
              routerLinkActive="bg-primary-100 text-primary-700"
              class="px-4 py-2 rounded-lg text-sm font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
            >
              Vista Mensal
            </a>
            <a
              *ngIf="isAdmin()"
              routerLink="/monthly-profit"
              routerLinkActive="bg-primary-100 text-primary-700"
              class="px-4 py-2 rounded-lg text-sm font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
            >
              Vista de Contas Mensal
            </a>
            <a
              *ngIf="isAdmin()"
              routerLink="/admin"
              routerLinkActive="bg-primary-100 text-primary-700"
              class="px-4 py-2 rounded-lg text-sm font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
            >
              Admin
            </a>
          </div>
        </div>

        <!-- User Menu -->
        <div class="flex items-center space-x-4">
          <div class="hidden md:flex items-center space-x-3">
            <span class="text-sm text-secondary-600">
              {{ currentUser?.username }}
              <span class="ml-1 px-2 py-1 text-xs font-semibold rounded-full"
                    [class.bg-accent-100]="isAdmin()"
                    [class.text-accent-700]="isAdmin()"
                    [class.bg-secondary-100]="!isAdmin()"
                    [class.text-secondary-700]="!isAdmin()">
                {{ currentUser?.role }}
              </span>
            </span>
            <button
              (click)="logout()"
              class="px-4 py-2 rounded-lg text-sm font-medium text-white bg-danger-600 hover:bg-danger-700 transition-all"
            >
              Logout
            </button>
          </div>

          <!-- Mobile Menu Button -->
          <button
            (click)="toggleMobileMenu()"
            class="md:hidden p-2 rounded-lg text-secondary-600 hover:text-secondary-900 hover:bg-secondary-100 transition-all"
          >
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path *ngIf="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              <path *ngIf="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden border-t border-secondary-200">
      <div class="px-4 pt-2 pb-3 space-y-1">
        <a
          routerLink="/weekly-hours"
          routerLinkActive="bg-primary-100 text-primary-700"
          (click)="toggleMobileMenu()"
          class="block px-4 py-3 rounded-lg text-base font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
        >
          Weekly Hours
        </a>
        <a
          routerLink="/monthly-buy"
          routerLinkActive="bg-primary-100 text-primary-700"
          (click)="toggleMobileMenu()"
          class="block px-4 py-3 rounded-lg text-base font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
        >
          Monthly Buy
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/monthly-profit"
          routerLinkActive="bg-primary-100 text-primary-700"
          (click)="toggleMobileMenu()"
          class="block px-4 py-3 rounded-lg text-base font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
        >
          Monthly Profit
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/admin"
          routerLinkActive="bg-primary-100 text-primary-700"
          (click)="toggleMobileMenu()"
          class="block px-4 py-3 rounded-lg text-base font-medium text-secondary-700 hover:bg-secondary-100 transition-all"
        >
          Admin
        </a>
        
        <!-- Mobile User Info and Logout -->
        <div class="pt-4 border-t border-secondary-200 mt-4">
          <div class="px-4 py-2">
            <p class="text-sm text-secondary-600">Signed in as</p>
            <p class="text-base font-medium text-secondary-900">
              {{ currentUser?.username }}
              <span class="ml-2 px-2 py-1 text-xs font-semibold rounded-full"
                    [class.bg-accent-100]="isAdmin()"
                    [class.text-accent-700]="isAdmin()"
                    [class.bg-secondary-100]="!isAdmin()"
                    [class.text-secondary-700]="!isAdmin()">
                {{ currentUser?.role }}
              </span>
            </p>
          </div>
          <button
            (click)="logout()"
            class="mt-2 w-full text-left px-4 py-3 rounded-lg text-base font-medium text-white bg-danger-600 hover:bg-danger-700 transition-all"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-[1700px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
  </main>
</div>
